<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Console, CAN empty</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 4px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <div style="display: flex; align-items: center; gap: 4px">
            <a
              href="#"
              style="
                display: inline-flex;
                align-items: center;
                gap: 2px;
                height: 44px;
                padding-right: 8px;
                color: #c9cdd2;
                text-decoration: none;
                font-size: 16px;
              "
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 6l-6 6 6 6"></path></svg
              >Device</a
            >
            <h1 style="margin: 0 0 0 auto; font-size: 20px">Console</h1>
          </div>
          <div
            role="tablist"
            style="
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              role="tab"
              aria-selected="false"
              style="
                height: 44px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Log
            </button>
            <button
              role="tab"
              aria-selected="false"
              style="
                height: 44px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Send
            </button>
            <button
              role="tab"
              aria-selected="true"
              style="
                height: 44px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              CAN
            </button>
          </div>

          <div
            style="
              flex: 1;
              border: 1px dashed #3a3f46;
              border-radius: 14px;
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 14px;
              text-align: center;
            "
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6B7178"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M7 9h4M7 13h10M7 17h6"></path>
            </svg>
            <div style="font-size: 19px; font-weight: 600; line-height: 1.35">
              Raw CAN frames aren’t sent over Bluetooth yet.
            </div>
            <div style="font-size: 15px; line-height: 1.5; color: #a0a6ad">
              A future dash update will add them. Until then, use the Tuner’s
              Raw CAN frames view on Wi-Fi.
            </div>
          </div>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="device"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

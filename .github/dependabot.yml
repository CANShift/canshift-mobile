version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Expo SDK-aligned + React Native native modules move with the Expo SDK
      # (`expo install` / SDK upgrade), never standalone bumps — Dependabot
      # proposed jumps (expo-constants 18 -> 57, react-native-svg 15.12 -> 15.15)
      # that pass JS checks but fail the iOS native build.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@types/react"
      # jest-expo is SDK-aligned too and matches neither "expo" nor "expo-*";
      # 57.x targets SDK 57 while this app is on SDK 54.
      - dependency-name: "jest-expo"
      # Pinned to @canshift/core's major so schemas stay compatible.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # tailwind-merge majors track Tailwind majors — its class map is rebuilt
      # per Tailwind scale, and under NativeWind conflicts resolve by order, so
      # a lone bump mis-styles with no type error and no failing test.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nativewind"
        update-types: ["version-update:semver-major"]
      # Toolchain majors need a coordinated migration.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lint-staged"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Laps, landscape</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 844px;
          height: 390px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 96px;
            height: 390px;
          "
        >
          <dc-import
            name="MRail"
            active="laps"
            conn="connected"
            hint-size="96px,390px"
          ></dc-import>
        </div>

        <section
          style="
            position: absolute;
            left: 116px;
            top: 20px;
            width: 420px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <span
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                height: 28px;
                padding: 0 10px;
                border-radius: 6px;
                background: #123826;
                color: #b8f2d3;
                font-size: 13px;
                font-weight: 800;
                letter-spacing: 0.06em;
              "
              ><span
                style="
                  width: 8px;
                  height: 8px;
                  border-radius: 4px;
                  background: #3dd68c;
                "
              ></span
              >TRACK MODE · GPS</span
            >
            <span style="font-size: 20px; font-weight: 700">Lap 4</span>
          </div>
          <div
            style="
              font-family: ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
              font-size: 100px;
              font-weight: 700;
              line-height: 1;
              letter-spacing: -0.03em;
            "
          >
            1:12.48
          </div>
          <div
            style="
              font-family: ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
              font-size: 34px;
              font-weight: 700;
              color: #3dd68c;
            "
          >
            −0.42
            <span
              style="
                font-family:
                  -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                  system-ui, sans-serif;
                font-size: 17px;
                font-weight: 500;
                color: #b8f2d3;
              "
              >vs best</span
            >
          </div>
          <div style="margin-top: auto; display: flex; gap: 10px">
            <div
              style="
                flex: 1;
                background: #16181b;
                border: 1px solid #2b2f35;
                border-radius: 12px;
                padding: 10px 12px;
              "
            >
              <div style="font-size: 13px; color: #a0a6ad">Best</div>
              <div
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 22px;
                  font-weight: 700;
                "
              >
                1:11.90
              </div>
            </div>
            <div
              style="
                flex: 1;
                background: #16181b;
                border: 1px solid #2b2f35;
                border-radius: 12px;
                padding: 10px 12px;
              "
            >
              <div style="font-size: 13px; color: #a0a6ad">Last</div>
              <div
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 22px;
                  font-weight: 700;
                "
              >
                1:12.32
              </div>
            </div>
          </div>
        </section>

        <section
          style="
            position: absolute;
            left: 556px;
            right: 16px;
            top: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <div
            style="
              flex: 1;
              min-height: 0;
              overflow: hidden;
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              display: flex;
              flex-direction: column;
            "
          >
            <sc-for list="{{laps}}" as="l" hint-placeholder-count="3">
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  height: 52px;
                  padding: 0 14px;
                  border-bottom: 1px solid #23262b;
                "
              >
                <span style="width: 44px; font-size: 14px; color: #a0a6ad"
                  >Lap {{l.n}}</span
                >
                <span
                  style="
                    flex: 1;
                    font-family:
                      ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                    font-size: 19px;
                    font-weight: 700;
                  "
                  >{{l.time}}</span
                >
                <span
                  style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px; font-weight: 700; color: {{l.deltaColor}}"
                  >{{l.delta}}</span
                >
              </div>
            </sc-for>
          </div>
          <button
            style="
              height: 60px;
              border-radius: 14px;
              background: transparent;
              color: #f2f3f5;
              border: 1.5px solid #3a3f46;
              font: inherit;
              font-size: 17px;
              font-weight: 600;
            "
          >
            Stop track mode
          </button>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":844,"height":390}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {
            laps: [
              { n: 3, time: '1:12.32', delta: '+0.42', deltaColor: '#C9CDD2' },
              { n: 2, time: '1:11.90', delta: 'BEST', deltaColor: '#3DD68C' },
              { n: 1, time: '1:14.07', delta: '+2.17', deltaColor: '#C9CDD2' }
            ]
          };
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Laps, GPS running</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          "
        >
          <div
            role="group"
            aria-label="Timer"
            style="
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              aria-pressed="true"
              style="
                height: 50px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              GPS timing
            </button>
            <button
              aria-pressed="false"
              style="
                height: 50px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Dash timer
            </button>
          </div>

          <section
            style="
              display: flex;
              flex-direction: column;
              gap: 6px;
              padding: 6px 4px 0;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <span
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 8px;
                  height: 28px;
                  padding: 0 10px;
                  border-radius: 6px;
                  background: #123826;
                  color: #b8f2d3;
                  font-size: 13px;
                  font-weight: 800;
                  letter-spacing: 0.06em;
                "
                ><span
                  style="
                    width: 8px;
                    height: 8px;
                    border-radius: 4px;
                    background: #3dd68c;
                  "
                ></span
                >TRACK MODE</span
              >
              <span style="font-size: 18px; font-weight: 700">Lap 4</span>
            </div>
            <div
              style="
                font-family:
                  ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                font-size: 78px;
                font-weight: 700;
                line-height: 1.05;
                letter-spacing: -0.02em;
              "
            >
              1:12.48
            </div>
            <div
              style="
                font-family:
                  ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                font-size: 26px;
                font-weight: 700;
                color: #3dd68c;
              "
            >
              −0.42
              <span
                style="
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                    system-ui, sans-serif;
                  font-size: 15px;
                  font-weight: 500;
                  color: #b8f2d3;
                "
                >vs best</span
              >
            </div>
          </section>

          <div
            style="
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 8px;
            "
          >
            <div
              style="
                background: #16181b;
                border: 1px solid #2b2f35;
                border-radius: 12px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 4px;
              "
            >
              <span style="font-size: 13px; color: #a0a6ad">Best</span
              ><span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 21px;
                  font-weight: 700;
                "
                >1:11.90</span
              >
            </div>
            <div
              style="
                background: #16181b;
                border: 1px solid #2b2f35;
                border-radius: 12px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 4px;
              "
            >
              <span style="font-size: 13px; color: #a0a6ad">Last</span
              ><span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 21px;
                  font-weight: 700;
                "
                >1:12.32</span
              >
            </div>
            <div
              style="
                background: #16181b;
                border: 1px solid #2b2f35;
                border-radius: 12px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 4px;
              "
            >
              <span style="font-size: 13px; color: #a0a6ad">Laps</span
              ><span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 21px;
                  font-weight: 700;
                "
                >3</span
              >
            </div>
          </div>

          <div
            style="
              flex: 1;
              min-height: 0;
              overflow: hidden;
              display: flex;
              flex-direction: column;
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
            "
          >
            <sc-for list="{{laps}}" as="l" hint-placeholder-count="3">
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  height: 52px;
                  padding: 0 16px;
                  border-bottom: 1px solid #23262b;
                "
              >
                <span style="width: 56px; font-size: 15px; color: #a0a6ad"
                  >Lap {{l.n}}</span
                >
                <span
                  style="
                    flex: 1;
                    font-family:
                      ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                    font-size: 20px;
                    font-weight: 700;
                  "
                  >{{l.time}}</span
                >
                <span
                  style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 15px; font-weight: 700; color: {{l.deltaColor}}"
                  >{{l.delta}}</span
                >
              </div>
            </sc-for>
          </div>

          <button
            style="
              height: 60px;
              border-radius: 14px;
              background: transparent;
              color: #f2f3f5;
              border: 1.5px solid #3a3f46;
              font: inherit;
              font-size: 18px;
              font-weight: 600;
            "
          >
            Stop track mode
          </button>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="laps"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {
            laps: [
              { n: 3, time: '1:12.32', delta: '+0.42', deltaColor: '#C9CDD2' },
              { n: 2, time: '1:11.90', delta: 'BEST', deltaColor: '#3DD68C' },
              { n: 1, time: '1:14.07', delta: '+2.17', deltaColor: '#C9CDD2' }
            ]
          };
        }
      }
    </script>
  </body>
</html>

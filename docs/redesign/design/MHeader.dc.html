<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mobile header</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <header
        style="
          width: 390px;
          height: 56px;
          box-sizing: border-box;
          padding: 0 16px;
          display: flex;
          align-items: center;
          gap: 10px;
          background: #0e0f11;
          border-bottom: 1px solid #2b2f35;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <span
          style="width: 10px; height: 10px; border-radius: 5px; box-sizing: border-box; flex: none; background: {{dotFill}}; border: 2px solid {{dotColor}}"
        ></span>
        <span
          style="font-size: 16px; font-weight: 700; color: {{labelColor}}; white-space: nowrap"
          >{{label}}</span
        >
        <span
          style="
            flex: 1;
            min-width: 0;
            font-size: 14px;
            color: #a0a6ad;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          "
          >{{name}}</span
        >
        <sc-if value="{{showLogging}}" hint-placeholder-val="{{ false }}">
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              height: 28px;
              padding: 0 10px;
              border-radius: 14px;
              background: #2a1010;
              color: #ffb3b3;
              font-size: 12px;
              font-weight: 700;
              letter-spacing: 0.06em;
            "
            ><span
              style="
                width: 8px;
                height: 8px;
                border-radius: 4px;
                background: #ff4747;
              "
            ></span
            >LOGGING</span
          >
        </sc-if>
        <sc-if value="{{showDemo}}" hint-placeholder-val="{{ false }}">
          <span
            style="
              display: inline-flex;
              align-items: center;
              height: 28px;
              padding: 0 10px;
              border-radius: 14px;
              border: 1.5px solid #ff8800;
              color: #ff8800;
              font-size: 12px;
              font-weight: 700;
              letter-spacing: 0.06em;
              box-sizing: border-box;
            "
            >DEMO</span
          >
        </sc-if>
      </header>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"conn":{"editor":"enum","options":["connected","reconnecting","offline","scanning","demo"],"default":"connected"},"dash":{"editor":"text","default":"CANShift-4F2A"},"badge":{"editor":"enum","options":["none","logging","demo"],"default":"none"},"$preview":{"width":390,"height":56}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const conn = this.props.conn ?? 'connected';
          const map = {
            connected:    { label: 'Connected',      dot: '#3DD68C', fill: '#3DD68C', color: '#F2F3F5' },
            demo:         { label: 'Demo',           dot: '#FF8800', fill: '#FF8800', color: '#F2F3F5' },
            reconnecting: { label: 'Reconnecting…',  dot: '#FF8800', fill: 'transparent', color: '#FF8800' },
            scanning:     { label: 'Searching…',     dot: '#A0A6AD', fill: 'transparent', color: '#F2F3F5' },
            offline:      { label: 'Not connected',  dot: '#A0A6AD', fill: 'transparent', color: '#F2F3F5' }
          };
          const s = map[conn] || map.connected;
          const badge = this.props.badge ?? 'none';
          const name = this.props.dash ?? 'CANShift-4F2A';
          return {
            label: s.label, dotColor: s.dot, dotFill: s.fill, labelColor: s.color,
            name: name ? '· ' + name : '',
            showLogging: badge === 'logging',
            showDemo: badge === 'demo'
          };
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>First run, Bluetooth</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
          box-sizing: border-box;
          padding: 120px 24px 48px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        "
      >
        <div
          style="
            width: 88px;
            height: 88px;
            border-radius: 44px;
            background: #1e2125;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <svg
            width="44"
            height="44"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#F2F3F5"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 7l10 10-5 5V2l5 5L7 17"></path>
          </svg>
        </div>
        <h1 style="margin: 0; font-size: 32px; line-height: 1.15">
          Bluetooth finds your dash
        </h1>
        <div style="font-size: 18px; line-height: 1.5; color: #c9cdd2">
          CANShift uses Bluetooth to read live data from your dash. Nothing
          else.
        </div>
        <div style="font-size: 15px; line-height: 1.5; color: #a0a6ad">
          Next, iOS asks for permission. Choose Allow.
        </div>
        <div
          style="
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <button
            style="
              height: 60px;
              border-radius: 12px;
              background: #d63333;
              color: #ffffff;
              border: 0;
              font: inherit;
              font-size: 18px;
              font-weight: 600;
            "
          >
            Continue
          </button>
          <button
            style="
              height: 52px;
              border-radius: 12px;
              background: transparent;
              color: #f2f3f5;
              border: 1px solid #2b2f35;
              font: inherit;
              font-size: 16px;
            "
          >
            Try demo mode
          </button>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

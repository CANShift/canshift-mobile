<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Laps, GPS no fix</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          "
        >
          <h1 style="margin: 0; font-size: 26px">Laps</h1>
          <div
            role="group"
            aria-label="Timer"
            style="
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              aria-pressed="true"
              style="
                height: 50px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              GPS timing
            </button>
            <button
              aria-pressed="false"
              style="
                height: 50px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Dash timer
            </button>
          </div>

          <section
            style="
              background: #2a1c0a;
              border-radius: 14px;
              padding: 18px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <div style="display: flex; align-items: center; gap: 12px">
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FF8800"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 1v3M12 20v3M1 12h3M20 12h3"></path>
              </svg>
              <span style="font-size: 22px; font-weight: 700; color: #ffd9a8"
                >Waiting for GPS…</span
              >
            </div>
            <div style="font-size: 16px; color: #ffc27a; line-height: 1.45">
              Accuracy 18 m. Needs better than 5 m.
            </div>
            <div
              aria-hidden="true"
              style="
                height: 8px;
                border-radius: 4px;
                background: #5a3a12;
                overflow: hidden;
              "
            >
              <div style="width: 28%; height: 8px; background: #ff8800"></div>
            </div>
            <div style="font-size: 15px; color: #ffc27a">Move to open sky.</div>
          </section>

          <section
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 12px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <span style="font-size: 17px; font-weight: 600"
                >Start/finish line</span
              >
              <span style="font-size: 15px; color: #a0a6ad">Not set</span>
            </div>
            <div style="font-size: 14px; color: #a0a6ad; line-height: 1.45">
              Drive to the line, stop, then tap Set line here.
            </div>
            <button
              disabled
              style="
                height: 56px;
                border-radius: 12px;
                background: #1e2125;
                color: #6b7178;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 17px;
                font-weight: 600;
              "
            >
              Set line here
            </button>
          </section>

          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 8px;
            "
          >
            <button
              disabled
              style="
                height: 64px;
                border-radius: 14px;
                background: #1e2125;
                color: #6b7178;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 19px;
                font-weight: 700;
              "
            >
              Start track mode
            </button>
            <span style="font-size: 14px; color: #a0a6ad; text-align: center"
              >Needs a GPS fix and a start/finish line.</span
            >
          </div>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="laps"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scan, pairing</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="scanning"
            dash="CANShift-4F2A"
            hint-size="390px,56px"
          ></dc-import>
        </div>
        <div
          style="
            position: absolute;
            left: 24px;
            top: 88px;
            font-size: 32px;
            font-weight: 700;
          "
        >
          Dashes nearby
        </div>
        <div
          aria-hidden="true"
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
          "
        ></div>

        <section
          role="dialog"
          aria-labelledby="pt"
          style="
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: #16181b;
            border-top: 1px solid #2b2f35;
            border-radius: 16px 16px 0 0;
            box-sizing: border-box;
            padding: 10px 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
          "
        >
          <div
            aria-hidden="true"
            style="
              align-self: center;
              width: 36px;
              height: 4px;
              border-radius: 2px;
              background: #3a3f46;
            "
          ></div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 15px; color: #a0a6ad"
              >Connecting to CANShift-4F2A</span
            >
            <h2 id="pt" style="margin: 0; font-size: 28px">
              Confirm on the dash
            </h2>
          </div>
          <div style="font-size: 17px; line-height: 1.5; color: #c9cdd2">
            The dash shows a four-digit code. Confirm it there.
          </div>
          <div
            aria-label="Code 4 8 2 7"
            style="
              display: grid;
              grid-template-columns: repeat(4, minmax(0, 1fr));
              gap: 10px;
            "
          >
            <span
              style="
                height: 80px;
                border-radius: 12px;
                background: #0e0f11;
                border: 1px solid #2b2f35;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                  ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                font-size: 44px;
                font-weight: 700;
              "
              >4</span
            >
            <span
              style="
                height: 80px;
                border-radius: 12px;
                background: #0e0f11;
                border: 1px solid #2b2f35;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                  ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                font-size: 44px;
                font-weight: 700;
              "
              >8</span
            >
            <span
              style="
                height: 80px;
                border-radius: 12px;
                background: #0e0f11;
                border: 1px solid #2b2f35;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                  ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                font-size: 44px;
                font-weight: 700;
              "
              >2</span
            >
            <span
              style="
                height: 80px;
                border-radius: 12px;
                background: #0e0f11;
                border: 1px solid #2b2f35;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                  ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                font-size: 44px;
                font-weight: 700;
              "
              >7</span
            >
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              font-size: 16px;
              color: #c9cdd2;
            "
          >
            <span
              aria-hidden="true"
              style="
                width: 18px;
                height: 18px;
                border-radius: 9px;
                border: 2.5px solid #3a3f46;
                border-top-color: #f2f3f5;
                box-sizing: border-box;
              "
            ></span
            >Waiting for the dash…
          </div>
          <button
            style="
              height: 56px;
              border-radius: 12px;
              background: transparent;
              color: #f2f3f5;
              border: 1px solid #2b2f35;
              font: inherit;
              font-size: 17px;
            "
          >
            Cancel
          </button>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

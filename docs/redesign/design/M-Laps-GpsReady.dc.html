<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Laps, GPS ready</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          "
        >
          <h1 style="margin: 0; font-size: 26px">Laps</h1>
          <div
            role="group"
            aria-label="Timer"
            style="
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              aria-pressed="true"
              style="
                height: 50px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              GPS timing
            </button>
            <button
              aria-pressed="false"
              style="
                height: 50px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Dash timer
            </button>
          </div>

          <section
            style="
              background: #123826;
              border-radius: 14px;
              padding: 16px 18px;
              display: flex;
              align-items: center;
              gap: 12px;
            "
          >
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#3DD68C"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="12" cy="12" r="8"></circle>
              <path d="M12 1v3M12 20v3M1 12h3M20 12h3"></path>
            </svg>
            <span
              style="flex: 1; font-size: 20px; font-weight: 700; color: #b8f2d3"
              >GPS ready</span
            >
            <span
              style="
                font-family:
                  ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                font-size: 16px;
                color: #b8f2d3;
              "
              >± 3 m</span
            >
          </section>

          <section
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 12px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <span style="font-size: 17px; font-weight: 600"
                >Start/finish line</span
              >
              <span
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 6px;
                  font-size: 15px;
                  color: #3dd68c;
                "
                ><svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M5 12l5 5L20 7"></path></svg
                >Line set</span
              >
            </div>
            <div style="font-size: 14px; color: #a0a6ad">
              Set 2 min ago, here.
            </div>
            <button
              style="
                height: 52px;
                border-radius: 12px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 16px;
              "
            >
              Reset line
            </button>
          </section>

          <section
            style="
              flex: 1;
              min-height: 0;
              display: flex;
              flex-direction: column;
              gap: 8px;
            "
          >
            <span style="font-size: 15px; color: #a0a6ad">Laps</span>
            <div
              style="
                flex: 1;
                border: 1px dashed #3a3f46;
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                color: #a0a6ad;
              "
            >
              No laps yet
            </div>
          </section>

          <button
            style="
              height: 64px;
              border-radius: 14px;
              background: #d63333;
              color: #ffffff;
              border: 0;
              font: inherit;
              font-size: 19px;
              font-weight: 700;
            "
          >
            Start track mode
          </button>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="laps"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

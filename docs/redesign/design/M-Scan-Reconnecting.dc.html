<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scan, reconnecting</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="reconnecting"
            dash=""
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <div
          role="status"
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            height: 64px;
            box-sizing: border-box;
            padding: 0 8px 0 16px;
            background: #2a1c0a;
            display: flex;
            align-items: center;
            gap: 12px;
          "
        >
          <span
            aria-hidden="true"
            style="
              width: 20px;
              height: 20px;
              border-radius: 10px;
              border: 2.5px solid #5a3a12;
              border-top-color: #ff8800;
              box-sizing: border-box;
              flex: none;
            "
          ></span>
          <span
            style="flex: 1; font-size: 15px; line-height: 1.35; color: #ffc27a"
            >Reconnecting to <b style="color: #ffd9a8">CANShift-4F2A</b>…</span
          >
          <button
            style="
              height: 48px;
              padding: 0 16px;
              border-radius: 10px;
              background: transparent;
              border: 1px solid #5a3a12;
              color: #ffd9a8;
              font: inherit;
              font-size: 15px;
              font-weight: 600;
            "
          >
            Cancel
          </button>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 120px;
            bottom: 0;
            box-sizing: border-box;
            padding: 56px 24px 48px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <div
            style="
              width: 88px;
              height: 88px;
              border-radius: 20px;
              background: #16181b;
              border: 1px solid #2b2f35;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6B7178"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <path d="M8 15a4 4 0 0 1 8 0"></path>
              <path d="M12 15l2-3"></path>
            </svg>
          </div>
          <h1 style="margin: 0; font-size: 32px">Find your dash</h1>
          <div style="font-size: 18px; line-height: 1.5; color: #c9cdd2">
            We’re trying your last dash first. Cancel to pick another one.
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <button
              disabled
              style="
                height: 60px;
                border-radius: 12px;
                background: #1e2125;
                color: #8a9097;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 18px;
                font-weight: 600;
              "
            >
              Scan for dashes
            </button>
            <button
              style="
                height: 52px;
                border-radius: 12px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 16px;
              "
            >
              Try demo mode
            </button>
          </div>
        </main>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

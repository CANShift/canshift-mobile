<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scan, empty</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="offline"
            dash=""
            hint-size="390px,56px"
          ></dc-import>
        </div>
        <a
          href="#"
          aria-label="App info"
          style="
            position: absolute;
            right: 8px;
            top: 6px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9cdd2;
          "
          ><svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 11v6M12 7.5v.5"></path></svg
        ></a>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 0;
            box-sizing: border-box;
            padding: 72px 24px 48px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <div
            style="
              width: 88px;
              height: 88px;
              border-radius: 20px;
              background: #16181b;
              border: 1px solid #2b2f35;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF4747"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <path d="M8 15a4 4 0 0 1 8 0"></path>
              <path d="M12 15l2-3"></path>
            </svg>
          </div>
          <h1 style="margin: 0; font-size: 32px">Find your dash</h1>
          <div style="font-size: 18px; line-height: 1.5; color: #c9cdd2">
            Turn on the dash and keep the phone close.
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <button
              style="
                height: 60px;
                border-radius: 12px;
                background: #d63333;
                color: #ffffff;
                border: 0;
                font: inherit;
                font-size: 18px;
                font-weight: 600;
              "
            >
              Scan for dashes
            </button>
            <button
              style="
                height: 52px;
                border-radius: 12px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 16px;
              "
            >
              Try demo mode
            </button>
          </div>
        </main>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

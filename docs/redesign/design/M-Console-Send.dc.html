<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Console, Send</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 4px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <div style="display: flex; align-items: center; gap: 4px">
            <a
              href="#"
              style="
                display: inline-flex;
                align-items: center;
                gap: 2px;
                height: 44px;
                padding-right: 8px;
                color: #c9cdd2;
                text-decoration: none;
                font-size: 16px;
              "
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 6l-6 6 6 6"></path></svg
              >Device</a
            >
            <h1 style="margin: 0 0 0 auto; font-size: 20px">Console</h1>
          </div>
          <div
            role="tablist"
            style="
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              role="tab"
              aria-selected="false"
              style="
                height: 44px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Log
            </button>
            <button
              role="tab"
              aria-selected="true"
              style="
                height: 44px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              Send
            </button>
            <button
              role="tab"
              aria-selected="false"
              style="
                height: 44px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              CAN
            </button>
          </div>

          <div
            style="
              display: flex;
              gap: 10px;
              align-items: flex-start;
              padding: 12px 14px;
              border-radius: 12px;
              background: #2a1c0a;
              color: #ffc27a;
              font-size: 14px;
              line-height: 1.45;
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF8800"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              style="flex: none"
            >
              <path d="M12 3l10 18H2z"></path>
              <path d="M12 10v5M12 18v.5"></path>
            </svg>
            <span
              >Commands go straight to the dash. Only use ones you know.</span
            >
          </div>

          <div
            style="
              flex: 1;
              min-height: 0;
              overflow: hidden;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <sc-for list="{{history}}" as="h" hint-placeholder-count="3">
              <div
                style="
                  background: #16181b;
                  border: 1px solid #2b2f35;
                  border-radius: 12px;
                  padding: 12px 14px;
                  display: flex;
                  flex-direction: column;
                  gap: 6px;
                "
              >
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    font-size: 12px;
                    color: #a0a6ad;
                  "
                >
                  <span>Sent · {{h.t}}</span
                  ><span style="color: {{h.statusColor}}">{{h.status}}</span>
                </div>
                <div
                  style="
                    font-family:
                      ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                    font-size: 15px;
                    font-weight: 700;
                  "
                >
                  &gt; {{h.cmd}}
                </div>
                <div
                  style="
                    font-family:
                      ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                    font-size: 13px;
                    color: #c9cdd2;
                    white-space: pre-line;
                  "
                >
                  {{h.reply}}
                </div>
              </div>
            </sc-for>
          </div>

          <div style="display: flex; gap: 8px">
            <label
              style="
                flex: 1;
                display: flex;
                align-items: center;
                height: 56px;
                padding: 0 14px;
                border-radius: 12px;
                background: #16181b;
                border: 2px solid #f2f3f5;
                box-sizing: border-box;
              "
            >
              <input
                value="get can.speed"
                aria-label="Command"
                style="
                  flex: 1;
                  min-width: 0;
                  background: transparent;
                  border: 0;
                  color: #f2f3f5;
                  font-size: 16px;
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                "
              />
            </label>
            <button
              style="
                height: 56px;
                padding: 0 20px;
                border-radius: 12px;
                background: #d63333;
                color: #ffffff;
                border: 0;
                font: inherit;
                font-size: 17px;
                font-weight: 700;
              "
            >
              Send
            </button>
          </div>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="device"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {
            history: [
              { t: '14:36:50', cmd: 'version', reply: 'canshift-s3 2.5.0\nconfig v7', status: 'Reply', statusColor: '#3DD68C' },
              { t: '14:37:12', cmd: 'get brightness', reply: '80', status: 'Reply', statusColor: '#3DD68C' },
              { t: '14:37:30', cmd: 'set led.test 1', reply: 'The dash didn’t reply.', status: 'No reply', statusColor: '#FF8800' }
            ]
          };
        }
      }
    </script>
  </body>
</html>

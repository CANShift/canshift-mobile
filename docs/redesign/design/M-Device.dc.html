<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Device, connected</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            overflow: hidden;
            box-sizing: border-box;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <h1 style="margin: 0; font-size: 26px">Device</h1>

          <section
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              padding: 16px;
              display: flex;
              align-items: center;
              gap: 12px;
            "
          >
            <div
              style="flex: 1; display: flex; flex-direction: column; gap: 4px"
            >
              <span
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 8px;
                  font-size: 18px;
                  font-weight: 700;
                "
                ><span
                  style="
                    width: 10px;
                    height: 10px;
                    border-radius: 5px;
                    background: #3dd68c;
                  "
                ></span
                >Connected</span
              >
              <span style="font-size: 14px; color: #a0a6ad"
                >CANShift-4F2A · Bluetooth</span
              >
            </div>
            <button
              style="
                height: 52px;
                padding: 0 16px;
                border-radius: 12px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 16px;
              "
            >
              Disconnect
            </button>
          </section>

          <section
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <span style="font-size: 17px; font-weight: 600"
                >Telemetry logging</span
              >
              <span style="font-size: 14px; color: #a0a6ad">Off</span>
            </div>
            <div
              aria-hidden="true"
              style="
                height: 8px;
                border-radius: 4px;
                background: #23262b;
                overflow: hidden;
              "
            >
              <div style="width: 15%; height: 8px; background: #a0a6ad"></div>
            </div>
            <span style="font-size: 14px; color: #a0a6ad"
              >1.2 MB of 8 MB used</span
            >
            <button
              style="
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                height: 52px;
                border-radius: 12px;
                background: #d63333;
                color: #ffffff;
                border: 0;
                font: inherit;
                font-size: 17px;
                font-weight: 700;
              "
            >
              <span
                style="
                  width: 12px;
                  height: 12px;
                  border-radius: 6px;
                  background: #ffffff;
                "
              ></span
              >Start logging
            </button>
          </section>

          <a
            href="#"
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              min-height: 56px;
              padding: 0 16px;
              border-radius: 14px;
              background: #16181b;
              border: 1px solid #2b2f35;
              color: #f2f3f5;
              text-decoration: none;
              font-size: 17px;
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#A0A6AD"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 17l6-5-6-5M12 19h8"></path>
            </svg>
            <span style="flex: 1">Console</span>
            <span style="font-size: 14px; color: #a0a6ad"
              >Log · Send · CAN</span
            >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6B7178"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6"></path>
            </svg>
          </a>

          <section
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              padding: 4px 16px;
              display: flex;
              flex-direction: column;
            "
          >
            <sc-for list="{{info}}" as="i" hint-placeholder-count="6">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  height: 40px;
                  border-bottom: 1px solid #23262b;
                  font-size: 15px;
                "
              >
                <span style="color: #a0a6ad">{{i.k}}</span>
                <span style="font-family: {{i.font}}; color: #F2F3F5"
                  >{{i.v}}</span
                >
              </div>
            </sc-for>
          </section>

          <a
            href="#"
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              min-height: 56px;
              padding: 0 16px;
              border-radius: 14px;
              background: #16181b;
              border: 1px solid #2b2f35;
              color: #f2f3f5;
              text-decoration: none;
              font-size: 17px;
            "
          >
            <span style="flex: 1">Try demo mode</span>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6B7178"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6"></path>
            </svg>
          </a>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="device"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const mono = "ui-monospace, 'SF Mono', Menlo, monospace";
          const sans = 'inherit';
          return {
            info: [
              { k: 'Dash name', v: 'CANShift-4F2A', font: sans },
              { k: 'Device ID', v: 'A4:CF:12:4F:2A:91', font: mono },
              { k: 'Firmware', v: '2.5.0', font: mono },
              { k: 'Config version', v: '7', font: mono },
              { k: 'App version', v: '1.8.2', font: mono },
              { k: 'Dash battery', v: '13.9 V', font: mono }
            ]
          };
        }
      }
    </script>
  </body>
</html>

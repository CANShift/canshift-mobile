<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Graph, empty</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <h1 style="margin: 0; font-size: 26px">Graph</h1>
            <div
              role="group"
              aria-label="Time window"
              style="
                display: flex;
                background: #16181b;
                border: 1px solid #2b2f35;
                border-radius: 10px;
                padding: 2px;
              "
            >
              <button
                aria-pressed="false"
                style="
                  height: 44px;
                  padding: 0 12px;
                  border-radius: 8px;
                  background: transparent;
                  color: #c9cdd2;
                  border: 0;
                  font: inherit;
                  font-size: 15px;
                "
              >
                30 s
              </button>
              <button
                aria-pressed="true"
                style="
                  height: 44px;
                  padding: 0 12px;
                  border-radius: 8px;
                  background: #f2f3f5;
                  color: #0e0f11;
                  border: 0;
                  font: inherit;
                  font-size: 15px;
                  font-weight: 700;
                "
              >
                1 min
              </button>
              <button
                aria-pressed="false"
                style="
                  height: 44px;
                  padding: 0 12px;
                  border-radius: 8px;
                  background: transparent;
                  color: #c9cdd2;
                  border: 0;
                  font: inherit;
                  font-size: 15px;
                "
              >
                2 min
              </button>
            </div>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <span
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                height: 44px;
                padding: 0 14px 0 12px;
                border-radius: 22px;
                background: #16181b;
                border: 1px solid #2b2f35;
                font-size: 14px;
              "
              ><span
                style="
                  width: 14px;
                  height: 4px;
                  border-radius: 2px;
                  background: #f2f3f5;
                "
              ></span
              >RPM<span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  color: #6b7178;
                "
                >—</span
              ></span
            >
            <button
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 44px;
                padding: 0 14px;
                border-radius: 22px;
                background: transparent;
                border: 1px dashed #3a3f46;
                color: #f2f3f5;
                font: inherit;
                font-size: 14px;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14"></path></svg
              >Add signal
            </button>
          </div>

          <div
            style="
              flex: 1;
              min-height: 0;
              background: #16181b;
              border: 1px dashed #3a3f46;
              border-radius: 14px;
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 14px;
              text-align: center;
            "
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6B7178"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3v18h18"></path>
              <path d="M7 15l4-4 3 3 5-6"></path>
            </svg>
            <div style="font-size: 19px; font-weight: 600">
              No telemetry has been captured yet.
            </div>
            <div style="font-size: 15px; line-height: 1.5; color: #a0a6ad">
              The graph fills in as soon as the dash sends data.
            </div>
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 8px;
            "
          >
            <button
              disabled
              style="
                height: 56px;
                border-radius: 12px;
                background: #1e2125;
                color: #6b7178;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              Pause
            </button>
            <button
              disabled
              style="
                height: 56px;
                border-radius: 12px;
                background: #1e2125;
                color: #6b7178;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 16px;
              "
            >
              Clear
            </button>
            <button
              disabled
              style="
                height: 56px;
                border-radius: 12px;
                background: #1e2125;
                color: #6b7178;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 16px;
              "
            >
              Export
            </button>
          </div>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="graph"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

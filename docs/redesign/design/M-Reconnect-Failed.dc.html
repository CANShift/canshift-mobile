<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reconnect failed</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="offline"
            hint-size="390px,56px"
          ></dc-import>
        </div>
        <div
          style="
            position: absolute;
            left: 12px;
            right: 12px;
            top: 72px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
          "
        >
          <div
            style="
              height: 140px;
              border-radius: 14px;
              border: 1.5px dashed #3a3f46;
            "
          ></div>
          <div
            style="
              height: 140px;
              border-radius: 14px;
              border: 1.5px dashed #3a3f46;
            "
          ></div>
          <div
            style="
              height: 140px;
              border-radius: 14px;
              border: 1.5px dashed #3a3f46;
            "
          ></div>
          <div
            style="
              height: 140px;
              border-radius: 14px;
              border: 1.5px dashed #3a3f46;
            "
          ></div>
        </div>
        <div
          aria-hidden="true"
          style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.72)"
        ></div>

        <section
          role="alertdialog"
          aria-labelledby="rf"
          style="
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 32px;
            background: #16181b;
            border: 1px solid #2b2f35;
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          "
        >
          <div
            style="
              width: 56px;
              height: 56px;
              border-radius: 28px;
              background: #1e2125;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#C9CDD2"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M7 7l10 10-5 5V2l5 5L7 17"></path>
              <path d="M3 3l18 18"></path>
            </svg>
          </div>
          <h2 id="rf" style="margin: 0; font-size: 24px; line-height: 1.2">
            Couldn’t reconnect to CANShift-4F2A
          </h2>
          <div style="font-size: 17px; line-height: 1.5; color: #c9cdd2">
            The dash may be off or out of range. Values on screen are old.
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 10px;
              margin-top: 4px;
            "
          >
            <button
              style="
                height: 60px;
                border-radius: 12px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 18px;
                font-weight: 800;
              "
            >
              Try again
            </button>
            <button
              style="
                height: 56px;
                border-radius: 12px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 17px;
              "
            >
              Scan for dashes
            </button>
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scan, dashes found</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="offline"
            dash=""
            hint-size="390px,56px"
          ></dc-import>
        </div>
        <a
          href="#"
          aria-label="App info"
          style="
            position: absolute;
            right: 8px;
            top: 6px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9cdd2;
          "
          ><svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 11v6M12 7.5v.5"></path></svg
        ></a>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 0;
            box-sizing: border-box;
            padding: 32px 16px 48px;
            display: flex;
            flex-direction: column;
            gap: 16px;
          "
        >
          <div
            style="
              padding: 0 8px;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <h1 style="margin: 0; font-size: 32px">Dashes nearby</h1>
            <div style="font-size: 16px; color: #a0a6ad">
              Tap a dash to connect.
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px">
            <sc-for list="{{dashes}}" as="d" hint-placeholder-count="3">
              <button
                style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 16px; box-sizing: border-box; border-radius: 14px; background: #16181B; border: {{d.border}}; color: #F2F3F5; font: inherit; text-align: left"
              >
                <svg
                  width="28"
                  height="28"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#FF4747"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                  <path d="M8 15a4 4 0 0 1 8 0"></path>
                  <path d="M12 15l2-3"></path>
                </svg>
                <span
                  style="
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 3px;
                  "
                >
                  <span style="font-size: 18px; font-weight: 600"
                    >{{d.name}}</span
                  >
                  <span style="font-size: 14px; color: #a0a6ad">{{d.sub}}</span>
                </span>
                <span
                  aria-label="{{d.signal}}"
                  style="
                    display: flex;
                    align-items: flex-end;
                    gap: 3px;
                    height: 20px;
                  "
                >
                  <span
                    style="width: 5px; height: 6px; border-radius: 1px; background: {{d.b1}}"
                  ></span>
                  <span
                    style="width: 5px; height: 11px; border-radius: 1px; background: {{d.b2}}"
                  ></span>
                  <span
                    style="width: 5px; height: 16px; border-radius: 1px; background: {{d.b3}}"
                  ></span>
                  <span
                    style="width: 5px; height: 20px; border-radius: 1px; background: {{d.b4}}"
                  ></span>
                </span>
              </button>
            </sc-for>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              padding: 0 8px;
              font-size: 14px;
              color: #a0a6ad;
            "
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#A0A6AD"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12l5 5L20 7"></path></svg
            >Search finished · 3 found
          </div>

          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <button
              style="
                height: 56px;
                border-radius: 12px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 17px;
              "
            >
              Scan again
            </button>
            <button
              style="
                height: 48px;
                border-radius: 12px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Try demo mode
            </button>
          </div>
        </main>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const rows = [
            ['CANShift-4F2A', 'Last used', 4, 'Strong signal', true],
            ['CANShift-91C0', 'Seen before', 2, 'OK signal', false],
            ['CANShift-07DE', 'New', 1, 'Weak signal', false]
          ];
          return {
            dashes: rows.map(([name, tag, bars, signal, last]) => {
              const on = '#F2F3F5', off = '#3A3F46';
              return {
                name, signal,
                sub: tag + ' · ' + signal,
                border: last ? '2px solid #F2F3F5' : '1px solid #2B2F35',
                b1: bars >= 1 ? on : off, b2: bars >= 2 ? on : off, b3: bars >= 3 ? on : off, b4: bars >= 4 ? on : off
              };
            })
          };
        }
      }
    </script>
  </body>
</html>

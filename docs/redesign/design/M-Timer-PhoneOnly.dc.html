<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dash timer, phone only</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="offline"
            dash=""
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          "
        >
          <div
            role="group"
            aria-label="Timer"
            style="
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              aria-pressed="false"
              style="
                height: 50px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              GPS timing
            </button>
            <button
              aria-pressed="true"
              style="
                height: 50px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              Dash timer
            </button>
          </div>

          <div
            style="
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 8px;
              padding-top: 6px;
            "
          >
            <span
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 30px;
                padding: 0 12px;
                border-radius: 6px;
                background: #123826;
                color: #b8f2d3;
                font-size: 13px;
                font-weight: 800;
                letter-spacing: 0.06em;
              "
              ><span
                style="
                  width: 8px;
                  height: 8px;
                  border-radius: 4px;
                  background: #3dd68c;
                "
              ></span
              >RUNNING</span
            >
            <span
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 30px;
                padding: 0 12px;
                border-radius: 6px;
                border: 1.5px solid #ff8800;
                color: #ff8800;
                font-size: 13px;
                font-weight: 800;
                letter-spacing: 0.06em;
                box-sizing: border-box;
              "
              ><svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="7" y="2" width="10" height="20" rx="2"></rect>
                <path d="M11 18h2"></path></svg
              >PHONE ONLY</span
            >
            <span style="margin-left: auto; font-size: 18px; font-weight: 700"
              >Lap 2</span
            >
          </div>
          <div
            style="
              font-family: ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
              font-size: 78px;
              font-weight: 700;
              line-height: 1.05;
            "
          >
            0:31.06
          </div>
          <div style="font-size: 15px; line-height: 1.45; color: #c9cdd2">
            The dash isn’t connected, so this timer runs on the phone only. It
            won’t show on the dash.
          </div>

          <div
            role="alert"
            style="
              display: flex;
              gap: 12px;
              align-items: flex-start;
              padding: 14px;
              border-radius: 12px;
              background: #2a1c0a;
              color: #ffc27a;
              font-size: 15px;
              line-height: 1.45;
            "
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF8800"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              style="flex: none"
            >
              <path d="M12 3l10 18H2z"></path>
              <path d="M12 10v5M12 18v.5"></path>
            </svg>
            <span
              >Laps can’t be saved: the phone is out of storage. They stay until
              you close the app.</span
            >
          </div>

          <div
            style="
              flex: 1;
              min-height: 0;
              overflow: hidden;
              display: flex;
              flex-direction: column;
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                height: 52px;
                padding: 0 16px;
              "
            >
              <span style="width: 56px; font-size: 15px; color: #a0a6ad"
                >Lap 1</span
              ><span
                style="
                  flex: 1;
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 20px;
                  font-weight: 700;
                "
                >1:14.52</span
              ><span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 15px;
                  font-weight: 700;
                  color: #3dd68c;
                "
                >BEST</span
              >
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px">
            <button
              style="
                height: 88px;
                border-radius: 16px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 22px;
                font-weight: 800;
              "
            >
              Capture lap
            </button>
            <button
              style="
                height: 88px;
                border-radius: 16px;
                background: transparent;
                color: #f2f3f5;
                border: 1.5px solid #3a3f46;
                font: inherit;
                font-size: 18px;
                font-weight: 600;
              "
            >
              Pause
            </button>
          </div>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="laps"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

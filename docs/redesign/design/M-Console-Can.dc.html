<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Console, CAN</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 4px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <div style="display: flex; align-items: center; gap: 4px">
            <a
              href="#"
              style="
                display: inline-flex;
                align-items: center;
                gap: 2px;
                height: 44px;
                padding-right: 8px;
                color: #c9cdd2;
                text-decoration: none;
                font-size: 16px;
              "
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 6l-6 6 6 6"></path></svg
              >Device</a
            >
            <h1 style="margin: 0 0 0 auto; font-size: 20px">Console</h1>
          </div>
          <div
            role="tablist"
            style="
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              role="tab"
              aria-selected="false"
              style="
                height: 44px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Log
            </button>
            <button
              role="tab"
              aria-selected="false"
              style="
                height: 44px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              Send
            </button>
            <button
              role="tab"
              aria-selected="true"
              style="
                height: 44px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              CAN
            </button>
          </div>

          <div style="display: flex; gap: 8px">
            <button
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                height: 44px;
                padding: 0 14px;
                border-radius: 10px;
                background: #16181b;
                border: 1px solid #2b2f35;
                color: #f2f3f5;
                font: inherit;
                font-size: 15px;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                <rect x="14" y="5" width="4" height="14" rx="1"></rect></svg
              >Pause
            </button>
            <label
              style="
                flex: 1;
                display: flex;
                align-items: center;
                gap: 8px;
                height: 44px;
                padding: 0 12px;
                border-radius: 10px;
                background: #16181b;
                border: 1px solid #2b2f35;
                box-sizing: border-box;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#A0A6AD"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 5h18l-7 8v6l-4 2v-8z"></path>
              </svg>
              <input
                placeholder="Filter by ID, e.g. 3E8"
                aria-label="Filter by ID"
                style="
                  flex: 1;
                  min-width: 0;
                  background: transparent;
                  border: 0;
                  color: #f2f3f5;
                  font-size: 15px;
                  font-family: inherit;
                "
              />
            </label>
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-size: 13px;
              color: #a0a6ad;
              padding: 0 2px;
            "
          >
            <span>9 IDs · 412 frames/s</span
            ><span>Changed bytes are bright</span>
          </div>

          <div
            style="
              flex: 1;
              min-height: 0;
              overflow: hidden;
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              display: flex;
              flex-direction: column;
              font-family: ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
            "
          >
            <div
              style="
                display: grid;
                grid-template-columns: 52px 1fr 52px;
                gap: 8px;
                padding: 10px 12px;
                font-size: 12px;
                color: #a0a6ad;
                border-bottom: 1px solid #2b2f35;
                font-family:
                  -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                  system-ui, sans-serif;
              "
            >
              <span>ID</span><span>Data</span
              ><span style="text-align: right">Rate</span>
            </div>
            <sc-for list="{{frames}}" as="f" hint-placeholder-count="9">
              <div
                style="
                  display: grid;
                  grid-template-columns: 52px 1fr 52px;
                  gap: 8px;
                  align-items: center;
                  min-height: 44px;
                  padding: 0 12px;
                  border-bottom: 1px solid #23262b;
                  font-size: 14px;
                "
              >
                <span style="font-weight: 700">{{f.id}}</span>
                <span style="color: #8a9097; letter-spacing: 0.02em"
                  ><span style="color: #f2f3f5">{{f.hot}}</span>{{f.rest}}</span
                >
                <span style="text-align: right; color: #c9cdd2"
                  >{{f.rate}}</span
                >
              </div>
            </sc-for>
          </div>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="device"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const rows = [
            ['360', '0D 7A 00 54 ', '1F 40 00 00', '50 Hz'],
            ['361', '00 26 ', '01 72 00 3C 00 00', '50 Hz'],
            ['362', '', '03 E8 00 00 00 00 00 00', '20 Hz'],
            ['368', '00 8E ', '00 00 00 00 00 00', '20 Hz'],
            ['369', '', '00 00 00 00 00 00 00 00', '10 Hz'],
            ['36A', '01 2C 00 ', '00 00 00 00 00', '20 Hz'],
            ['370', '00 54 ', '00 00 00 00 00 00', '20 Hz'],
            ['372', '', '00 8A 00 00 00 00 00 00', '10 Hz'],
            ['3E0', '0B 5E ', '0B 0E 0A F0 0B 22', '5 Hz']
          ];
          return { frames: rows.map(([id, hot, rest, rate]) => ({ id, hot, rest, rate })) };
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dash timer, paused</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            box-sizing: border-box;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          "
        >
          <div
            role="group"
            aria-label="Timer"
            style="
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 3px;
            "
          >
            <button
              aria-pressed="false"
              style="
                height: 50px;
                border-radius: 9px;
                background: transparent;
                color: #c9cdd2;
                border: 0;
                font: inherit;
                font-size: 16px;
              "
            >
              GPS timing
            </button>
            <button
              aria-pressed="true"
              style="
                height: 50px;
                border-radius: 9px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 700;
              "
            >
              Dash timer
            </button>
          </div>

          <div
            style="
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 8px;
              padding-top: 6px;
            "
          >
            <span
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 30px;
                padding: 0 12px;
                border-radius: 6px;
                background: #2a1c0a;
                color: #ffc27a;
                font-size: 13px;
                font-weight: 800;
                letter-spacing: 0.06em;
              "
              ><svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                <rect x="14" y="5" width="4" height="14" rx="1"></rect></svg
              >PAUSED</span
            >
            <span
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 30px;
                padding: 0 12px;
                border-radius: 6px;
                border: 1.5px solid #3dd68c;
                color: #3dd68c;
                font-size: 13px;
                font-weight: 800;
                letter-spacing: 0.06em;
                box-sizing: border-box;
              "
              ><svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path>
                <path
                  d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"
                ></path></svg
              >SYNCED WITH DASH</span
            >
            <span style="margin-left: auto; font-size: 18px; font-weight: 700"
              >Lap 3</span
            >
          </div>
          <div
            style="
              font-family: ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
              font-size: 78px;
              font-weight: 700;
              line-height: 1.05;
              color: #ff8800;
            "
          >
            0:52.10
          </div>

          <div
            style="
              flex: 1;
              min-height: 0;
              overflow: hidden;
              display: flex;
              flex-direction: column;
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                height: 52px;
                padding: 0 16px;
                border-bottom: 1px solid #23262b;
              "
            >
              <span style="width: 56px; font-size: 15px; color: #a0a6ad"
                >Lap 2</span
              ><span
                style="
                  flex: 1;
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 20px;
                  font-weight: 700;
                "
                >1:12.04</span
              ><span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 15px;
                  font-weight: 700;
                  color: #3dd68c;
                "
                >BEST</span
              >
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                height: 52px;
                padding: 0 16px;
                border-bottom: 1px solid #23262b;
              "
            >
              <span style="width: 56px; font-size: 15px; color: #a0a6ad"
                >Lap 1</span
              ><span
                style="
                  flex: 1;
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 20px;
                  font-weight: 700;
                "
                >1:13.88</span
              ><span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                  font-size: 15px;
                  font-weight: 700;
                  color: #c9cdd2;
                "
                >+1.84</span
              >
            </div>
          </div>

          <button
            style="
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 12px;
              height: 96px;
              border-radius: 16px;
              background: #d63333;
              color: #ffffff;
              border: 0;
              font: inherit;
              font-size: 24px;
              font-weight: 800;
            "
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M7 4l13 8-13 8z"></path></svg
            >Resume
          </button>
          <button
            style="
              height: 60px;
              border-radius: 14px;
              background: transparent;
              color: #ff6b6b;
              border: 1.5px solid #3a3f46;
              font: inherit;
              font-size: 18px;
              font-weight: 600;
            "
          >
            Reset…
          </button>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="laps"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

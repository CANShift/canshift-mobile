<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reconnect banner</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="reconnecting"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <div
          role="status"
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            height: 68px;
            box-sizing: border-box;
            padding: 0 8px 0 16px;
            background: #2a1c0a;
            display: flex;
            align-items: center;
            gap: 12px;
          "
        >
          <span
            aria-hidden="true"
            style="
              width: 20px;
              height: 20px;
              border-radius: 10px;
              border: 2.5px solid #5a3a12;
              border-top-color: #ff8800;
              box-sizing: border-box;
              flex: none;
            "
          ></span>
          <div style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 700; color: #ffd9a8"
              >Reconnecting to the dash…</span
            >
            <span style="font-size: 13px; color: #ffc27a"
              >Values are paused. Try 2 of 5.</span
            >
          </div>
          <button
            style="
              height: 48px;
              padding: 0 16px;
              border-radius: 10px;
              background: transparent;
              border: 1px solid #5a3a12;
              color: #ffd9a8;
              font: inherit;
              font-size: 15px;
              font-weight: 600;
            "
          >
            Cancel
          </button>
        </div>

        <div
          aria-label="Shift light, paused"
          style="
            position: absolute;
            left: 12px;
            right: 12px;
            top: 134px;
            height: 14px;
            display: flex;
            gap: 4px;
          "
        >
          <sc-for list="{{lights}}" as="l" hint-placeholder-count="12"
            ><span
              style="flex: 1; border-radius: 3px; background: #1e2125"
            ></span
          ></sc-for>
        </div>

        <div
          style="
            position: absolute;
            left: 12px;
            right: 12px;
            top: 158px;
            bottom: 140px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 10px;
          "
        >
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
            <div
              style="
                border-radius: 14px;
                box-sizing: border-box;
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background: #0e0f11;
                border: 1.5px dashed #3a3f46;
              "
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 6px;
                "
              >
                <span
                  style="
                    font-size: 14px;
                    font-weight: 700;
                    letter-spacing: 0.06em;
                    color: #8a9097;
                  "
                  >{{t.label}}</span
                >
                <span style="font-size: 12px; font-weight: 700; color: #a0a6ad"
                  >4 s ago</span
                >
              </div>
              <div style="display: flex; align-items: baseline; gap: 6px">
                <span
                  style="
                    font-family:
                      ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                    font-size: 44px;
                    font-weight: 700;
                    line-height: 1;
                    color: #6b7178;
                  "
                  >{{t.value}}</span
                >
                <span style="font-size: 16px; color: #6b7178">{{t.unit}}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <div
          style="
            position: absolute;
            left: 0;
            right: 0;
            bottom: 84px;
            height: 56px;
            box-sizing: border-box;
            padding: 0 16px;
            border-top: 1px solid #23262b;
            display: flex;
            align-items: center;
            gap: 10px;
          "
        >
          <span
            style="
              width: 8px;
              height: 8px;
              border-radius: 4px;
              border: 2px solid #ff8800;
              box-sizing: border-box;
            "
          ></span>
          <span style="flex: 1; font-size: 14px; color: #c9cdd2"
            >Paused while reconnecting</span
          >
        </div>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="live"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const rows = [['RPM', '3450', 'rpm'], ['SPEED', '84', 'km/h'], ['WATER', '92', '°C'], ['OIL P', '3.8', 'bar'], ['OIL T', '104', '°C'], ['AFR', '14.2', ''], ['BATT', '13.8', 'V'], ['FUEL P', '3.0', 'bar']];
          return {
            lights: Array.from({ length: 12 }, () => ({})),
            tiles: rows.map(([label, value, unit]) => ({ label, value, unit }))
          };
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Device, demo mode</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="demo"
            dash="Demo dash"
            badge="demo"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 84px;
            overflow: hidden;
            box-sizing: border-box;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <h1 style="margin: 0; font-size: 26px">Device</h1>

          <section
            style="
              background: #2a1c0a;
              border: 2px solid #ff8800;
              border-radius: 14px;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 12px;
            "
          >
            <div style="display: flex; align-items: center; gap: 10px">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FF8800"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 4l13 8-13 8z"></path>
              </svg>
              <span style="font-size: 19px; font-weight: 700; color: #ffd9a8"
                >Demo mode</span
              >
            </div>
            <span style="font-size: 15px; line-height: 1.45; color: #ffc27a"
              >Values are simulated. No dash is connected. Alerts, laps and
              graphs all work, with fake data.</span
            >
            <button
              style="
                height: 60px;
                border-radius: 12px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 18px;
                font-weight: 800;
              "
            >
              End demo
            </button>
          </section>

          <section
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <span style="font-size: 17px; font-weight: 600"
                >Telemetry logging</span
              >
              <span style="font-size: 14px; color: #a0a6ad">Off</span>
            </div>
            <span style="font-size: 14px; color: #a0a6ad"
              >Demo data can be logged to try export.</span
            >
            <button
              style="
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                height: 52px;
                border-radius: 12px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 17px;
              "
            >
              <span
                style="
                  width: 12px;
                  height: 12px;
                  border-radius: 6px;
                  background: #ff4747;
                "
              ></span
              >Start logging
            </button>
          </section>

          <a
            href="#"
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              min-height: 56px;
              padding: 0 16px;
              border-radius: 14px;
              background: #16181b;
              border: 1px solid #2b2f35;
              color: #f2f3f5;
              text-decoration: none;
              font-size: 17px;
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#A0A6AD"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 17l6-5-6-5M12 19h8"></path>
            </svg>
            <span style="flex: 1">Console</span>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6B7178"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6"></path>
            </svg>
          </a>

          <section
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 14px;
              padding: 4px 16px;
              display: flex;
              flex-direction: column;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 40px;
                border-bottom: 1px solid #23262b;
                font-size: 15px;
              "
            >
              <span style="color: #a0a6ad">Dash name</span
              ><span>Demo dash (simulated)</span>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 40px;
                border-bottom: 1px solid #23262b;
                font-size: 15px;
              "
            >
              <span style="color: #a0a6ad">Firmware</span
              ><span style="color: #a0a6ad">—</span>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 40px;
                font-size: 15px;
              "
            >
              <span style="color: #a0a6ad">App version</span
              ><span
                style="
                  font-family:
                    ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                "
                >1.8.2</span
              >
            </div>
          </section>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="device"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

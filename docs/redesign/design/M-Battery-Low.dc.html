<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phone battery low</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, system-ui,
            sans-serif;
        "
      >
        <div
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 390px;
            height: 56px;
          "
        >
          <dc-import
            name="MHeader"
            conn="connected"
            hint-size="390px,56px"
          ></dc-import>
        </div>

        <div
          role="status"
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            height: 68px;
            box-sizing: border-box;
            padding: 0 4px 0 16px;
            background: #2a1c0a;
            display: flex;
            align-items: center;
            gap: 12px;
          "
        >
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FF8800"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="flex: none"
          >
            <rect x="2" y="7" width="17" height="10" rx="2"></rect>
            <path d="M22 11v2"></path>
            <rect
              x="4"
              y="9"
              width="3"
              height="6"
              rx="0.5"
              fill="#FF8800"
              stroke="none"
            ></rect>
          </svg>
          <span
            style="flex: 1; font-size: 14px; line-height: 1.35; color: #ffc27a"
            ><b style="color: #ffd9a8">Phone battery 9%.</b> Plug it in — alerts
            stop if the phone turns off.</span
          >
          <button
            aria-label="Dismiss"
            style="
              width: 48px;
              height: 48px;
              border-radius: 10px;
              background: transparent;
              border: 0;
              color: #ffd9a8;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
          </button>
        </div>

        <div
          aria-label="Shift light"
          style="
            position: absolute;
            left: 12px;
            right: 12px;
            top: 136px;
            height: 18px;
            display: flex;
            gap: 4px;
          "
        >
          <sc-for list="{{lights}}" as="l" hint-placeholder-count="12"
            ><span
              style="flex: 1; border-radius: 3px; background: {{l.c}}"
            ></span
          ></sc-for>
        </div>

        <div
          style="
            position: absolute;
            left: 12px;
            right: 12px;
            top: 164px;
            bottom: 140px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 10px;
          "
        >
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
            <div
              style="
                border-radius: 14px;
                box-sizing: border-box;
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background: #16181b;
                border: 1px solid #2b2f35;
              "
            >
              <span
                style="
                  font-size: 14px;
                  font-weight: 700;
                  letter-spacing: 0.06em;
                  color: #a0a6ad;
                "
                >{{t.label}}</span
              >
              <div style="display: flex; align-items: baseline; gap: 6px">
                <span
                  style="
                    font-family:
                      ui-monospace, &quot;SF Mono&quot;, Menlo, monospace;
                    font-size: 44px;
                    font-weight: 700;
                    line-height: 1;
                  "
                  >{{t.value}}</span
                >
                <span style="font-size: 16px; color: #a0a6ad">{{t.unit}}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <div
          style="
            position: absolute;
            left: 0;
            right: 0;
            bottom: 84px;
            height: 56px;
            box-sizing: border-box;
            padding: 0 8px 0 16px;
            border-top: 1px solid #23262b;
            display: flex;
            align-items: center;
            gap: 10px;
          "
        >
          <span
            style="
              width: 8px;
              height: 8px;
              border-radius: 4px;
              background: #3dd68c;
            "
          ></span>
          <span style="flex: 1; font-size: 14px; color: #c9cdd2"
            >Live · 20 updates/s</span
          >
          <button
            style="
              height: 44px;
              padding: 0 14px;
              border-radius: 10px;
              background: #16181b;
              border: 1px solid #2b2f35;
              color: #f2f3f5;
              font: inherit;
              font-size: 15px;
            "
          >
            Display
          </button>
        </div>

        <div
          style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 390px;
            height: 84px;
          "
        >
          <dc-import
            name="MTabBar"
            active="live"
            hint-size="390px,84px"
          ></dc-import>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const rows = [['RPM', '3450', 'rpm'], ['SPEED', '84', 'km/h'], ['WATER', '92', '°C'], ['OIL P', '3.8', 'bar'], ['OIL T', '104', '°C'], ['AFR', '14.2', ''], ['BATT', '13.8', 'V'], ['FUEL P', '3.0', 'bar']];
          return {
            lights: Array.from({ length: 12 }, (_, i) => ({ c: i < 5 ? '#3DD68C' : '#1E2125' })),
            tiles: rows.map(([label, value, unit]) => ({ label, value, unit }))
          };
        }
      }
    </script>
  </body>
</html>
